[pytest]
# Zonder testpaths verzamelt een kaal `pytest -q` de hele projectroot. Dat
# pakte ook losse diagnosescripts op die toevallig test_*.py of *_test.py
# heetten, en liet gelijknamige modules in de root en in tests/ met elkaar
# botsen ("import file mismatch"). Deze drie mappen zijn de echte suites.
#
# control_service/tests stond hier eerst niet bij. Die tests draaiden daardoor
# alleen als je ze met de hand noemde: een kale `pytest` sloeg ze over, en een
# test die niet vanzelf meedraait rot ongemerkt weg.
testpaths =
    tests
    dashboard/backend/tests
    control_service/tests

# Beide suites hebben modules met dezelfde naam op verschillende plekken;
# importmode=importlib laat pytest die uit elkaar houden zonder dat er
# __init__.py-bestanden aan de testmappen toegevoegd hoeven te worden.
addopts = --import-mode=importlib

filterwarnings =
    ignore::DeprecationWarning
